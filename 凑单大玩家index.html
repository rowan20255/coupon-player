<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凑单大玩家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #94a3b8; margin-top: 8px; }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select {
            flex: 1;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        input::placeholder { color: #64748b; }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: #2563eb; }
        button:active { transform: scale(0.98); }
        button.secondary {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        button.secondary:hover { background: rgba(59, 130, 246, 0.3); }
        button.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 8px 12px;
            font-size: 13px;
        }
        button.danger:hover { background: rgba(239, 68, 68, 0.3); }

        .item-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(51, 65, 85, 0.3);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item:hover { background: rgba(51, 65, 85, 0.5); }
        .item.selected {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #475569;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .item.selected .checkbox {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        .checkbox::after {
            content: '✓';
            color: white;
            font-size: 12px;
            opacity: 0;
        }
        .item.selected .checkbox::after { opacity: 1; }

        .item-info { flex: 1; }
        .item-name { font-weight: 500; }
        .item-shop { font-size: 12px; color: #94a3b8; }
        .item-filler {
            font-size: 11px;
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }
        .item-price {
            font-weight: 600;
            color: #60a5fa;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #94a3b8; }
        .result-value { font-weight: 600; }
        .result-value.discount { color: #4ade80; }
        .result-value.final { color: #60a5fa; font-size: 20px; }

        .warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(51, 65, 85, 0.3);
            border: none;
            border-radius: 12px;
            color: #94a3b8;
            cursor: pointer;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }

        .hidden { display: none !important; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .copy-btn {
            width: 100%;
            margin-top: 16px;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .copy-btn:hover { background: rgba(74, 222, 128, 0.3); }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>凑单大玩家</h1>
            <p>智能凑单，省钱省心</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('goods')">商品</button>
            <button class="tab" onclick="showTab('coupons')">优惠券</button>
            <button class="tab" onclick="showTab('result')">计算结果</button>
        </div>

        <!-- 商品页面 -->
        <div id="goods-tab" class="tab-content">
            <div class="card">
                <div class="section-title">🛒 添加商品</div>
                <div class="input-group">
                    <input type="text" id="goods-name" placeholder="商品名称">
                </div>
                <div class="input-group">
                    <input type="number" id="goods-price" placeholder="价格" step="0.01">
                    <select id="goods-shop">
                        <option value="">通用</option>
                        <option value="淘宝">淘宝</option>
                        <option value="京东">京东</option>
                        <option value="天猫">天猫</option>
                    </select>
                </div>
                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="goods-filler" style="width: auto;">
                        <span style="color: #94a3b8; font-size: 14px;">这是凑单品（非必需）</span>
                    </label>
                </div>
                <button onclick="addGoods()">添加商品</button>
            </div>

            <div class="card">
                <div class="section-title">📦 商品列表</div>
                <div id="goods-list" class="item-list">
                    <div class="empty-state">暂无商品，添加一些吧</div>
                </div>
            </div>
        </div>

        <!-- 优惠券页面 -->
        <div id="coupons-tab" class="tab-content hidden">
            <div class="card">
                <div class="section-title">🎫 添加优惠券</div>
                <div class="input-group">
                    <input type="text" id="coupon-name" placeholder="优惠券名称">
                </div>
                <div class="input-group">
                    <input type="number" id="coupon-target" placeholder="满多少" step="0.01">
                    <input type="number" id="coupon-discount" placeholder="减多少" step="0.01">
                </div>
                <div class="input-group">
                    <select id="coupon-shop">
                        <option value="">全平台通用</option>
                        <option value="淘宝">仅限淘宝</option>
                        <option value="京东">仅限京东</option>
                        <option value="天猫">仅限天猫</option>
                    </select>
                </div>
                <button onclick="addCoupon()">添加优惠券</button>
            </div>

            <div class="card">
                <div class="section-title">🎟️ 优惠券列表</div>
                <div id="coupons-list" class="item-list">
                    <div class="empty-state">暂无优惠券</div>
                </div>
            </div>
        </div>

        <!-- 计算结果页面 -->
        <div id="result-tab" class="tab-content hidden">
            <div class="card">
                <div class="section-title">💡 使用说明</div>
                <p style="color: #94a3b8; font-size: 14px; line-height: 1.6;">
                    1. 在"商品"页添加你想买的商品<br>
                    2. 在"优惠券"页添加你的优惠券<br>
                    3. 勾选要购买的商品<br>
                    4. 查看最优凑单方案
                </p>
            </div>

            <div id="results-container"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let goods = JSON.parse(localStorage.getItem('goods') || '[]');
        let coupons = JSON.parse(localStorage.getItem('coupons') || '[]');
        let selectedGoods = new Set(JSON.parse(localStorage.getItem('selectedGoods') || '[]'));

        // 保存数据
        function saveData() {
            localStorage.setItem('goods', JSON.stringify(goods));
            localStorage.setItem('coupons', JSON.stringify(coupons));
            localStorage.setItem('selectedGoods', JSON.stringify([...selectedGoods]));
        }

        // 切换标签
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));

            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.remove('hidden');

            if (tab === 'result') calculateResults();
        }

        // 添加商品
        function addGoods() {
            const name = document.getElementById('goods-name').value.trim();
            const price = parseFloat(document.getElementById('goods-price').value);
            const shop = document.getElementById('goods-shop').value;
            const isFiller = document.getElementById('goods-filler').checked;

            if (!name || !price || price <= 0) {
                alert('请填写完整的商品信息');
                return;
            }

            goods.push({
                id: Date.now(),
                name,
                price,
                shop,
                isFiller
            });

            saveData();
            renderGoods();

            // 清空输入
            document.getElementById('goods-name').value = '';
            document.getElementById('goods-price').value = '';
            document.getElementById('goods-filler').checked = false;
        }

        // 删除商品
        function deleteGoods(id) {
            goods = goods.filter(g => g.id !== id);
            selectedGoods.delete(id);
            saveData();
            renderGoods();
        }

        // 切换商品选中
        function toggleGoods(id) {
            if (selectedGoods.has(id)) {
                selectedGoods.delete(id);
            } else {
                selectedGoods.add(id);
            }
            saveData();
            renderGoods();
        }

        // 渲染商品列表
        function renderGoods() {
            const container = document.getElementById('goods-list');
            if (goods.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无商品，添加一些吧</div>';
                return;
            }

            container.innerHTML = goods.map(g => `
                <div class="item ${selectedGoods.has(g.id) ? 'selected' : ''}" onclick="toggleGoods(${g.id})">
                    <div class="checkbox"></div>
                    <div class="item-info">
                        <div class="item-name">${g.name}</div>
                        ${g.shop ? `<div class="item-shop">${g.shop}</div>` : ''}
                        ${g.isFiller ? '<span class="item-filler">凑单品</span>' : ''}
                    </div>
                    <div class="item-price">¥${g.price.toFixed(2)}</div>
                    <button class="danger" onclick="event.stopPropagation(); deleteGoods(${g.id})">删除</button>
                </div>
            `).join('');
        }

        // 添加优惠券
        function addCoupon() {
            const name = document.getElementById('coupon-name').value.trim();
            const target = parseFloat(document.getElementById('coupon-target').value);
            const discount = parseFloat(document.getElementById('coupon-discount').value);
            const shop = document.getElementById('coupon-shop').value;

            if (!name || !target || !discount) {
                alert('请填写完整的优惠券信息');
                return;
            }

            coupons.push({
                id: Date.now(),
                name,
                target,
                discount,
                shop
            });

            saveData();
            renderCoupons();

            document.getElementById('coupon-name').value = '';
            document.getElementById('coupon-target').value = '';
            document.getElementById('coupon-discount').value = '';
        }

        // 删除优惠券
        function deleteCoupon(id) {
            coupons = coupons.filter(c => c.id !== id);
            saveData();
            renderCoupons();
        }

        // 渲染优惠券
        function renderCoupons() {
            const container = document.getElementById('coupons-list');
            if (coupons.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无优惠券</div>';
                return;
            }

            container.innerHTML = coupons.map(c => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-name">${c.name}</div>
                        <div class="item-shop">满${c.target}减${c.discount}${c.shop ? ` · 仅限${c.shop}` : ''}</div>
                    </div>
                    <button class="danger" onclick="deleteCoupon(${c.id})">删除</button>
                </div>
            `).join('');
        }

        // 计算结果
        function calculateResults() {
            const selected = goods.filter(g => selectedGoods.has(g.id));
            const container = document.getElementById('results-container');

            if (selected.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">请先选择要购买的商品</div>
                    </div>
                `;
                return;
            }

            const totalWithoutCoupon = selected.reduce((sum, g) => sum + g.price, 0);
            const plans = [];

            // 不使用优惠券
            plans.push({
                name: '不使用优惠券',
                total: totalWithoutCoupon,
                discount: 0,
                final: totalWithoutCoupon,
                fillerTotal: selected.filter(g => g.isFiller).reduce((sum, g) => sum + g.price, 0)
            });

            // 使用每张优惠券
            coupons.forEach(coupon => {
                const applicable = selected.filter(g => !coupon.shop || g.shop === coupon.shop);
                const applicableTotal = applicable.reduce((sum, g) => sum + g.price, 0);

                if (applicableTotal >= coupon.target) {
                    const fillerInApplicable = applicable.filter(g => g.isFiller).reduce((sum, g) => sum + g.price, 0);
                    plans.push({
                        name: coupon.name,
                        coupon: coupon,
                        total: applicableTotal,
                        discount: coupon.discount,
                        final: applicableTotal - coupon.discount,
                        fillerTotal: fillerInApplicable,
                        invalidItems: selected.filter(g => coupon.shop && g.shop !== coupon.shop)
                    });
                }
            });

            // 排序：实付金额升序
            plans.sort((a, b) => a.final - b.final);

            // 渲染结果
            container.innerHTML = plans.map((plan, idx) => {
                const savings = totalWithoutCoupon - plan.final;
                const wasteScore = plan.discount > 0 ? Math.round(plan.fillerTotal / plan.discount * 100) : 0;

                return `
                    <div class="card ${idx === 0 ? 'result-card' : ''}">
                        ${idx === 0 ? '<div style="background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 12px;">最优方案</div>' : ''}

                        <div class="section-title">${plan.name}</div>

                        <div class="result-row">
                            <span class="result-label">商品总价</span>
                            <span class="result-value">¥${plan.total.toFixed(2)}</span>
                        </div>

                        ${plan.discount > 0 ? `
                        <div class="result-row">
                            <span class="result-label">优惠金额</span>
                            <span class="result-value discount">-¥${plan.discount.toFixed(2)}</span>
                        </div>
                        ` : ''}

                        <div class="result-row">
                            <span class="result-label">实付金额</span>
                            <span class="result-value final">¥${plan.final.toFixed(2)}</span>
                        </div>

                        ${savings > 0 ? `
                        <div class="result-row">
                            <span class="result-label">节省金额</span>
                            <span class="result-value discount">¥${savings.toFixed(2)}</span>
                        </div>
                        ` : ''}

                        ${plan.fillerTotal > 0 && wasteScore > 30 ? `
                        <div class="warning">
                            ⚠️ 凑单品花费 ¥${plan.fillerTotal.toFixed(2)}，浪费度 ${wasteScore}%<br>
                            为了省 ¥${plan.discount.toFixed(2)}，你多花了 ¥${plan.fillerTotal.toFixed(2)} 买凑单品
                        </div>
                        ` : ''}

                        ${plan.invalidItems && plan.invalidItems.length > 0 ? `
                        <div class="warning">
                            ⚠️ 以下商品不适用此券：${plan.invalidItems.map(g => g.name).join('、')}
                        </div>
                        ` : ''}

                        <button class="copy-btn" onclick="copyResult('${plan.name}', ${plan.total}, ${plan.discount}, ${plan.final})">
                            复制方案
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 复制结果
        function copyResult(name, total, discount, final) {
            const text = `凑单方案：${name}
商品总价：¥${total.toFixed(2)}
优惠金额：¥${discount.toFixed(2)}
实付金额：¥${final.toFixed(2)}`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }

            alert('已复制到剪贴板');
        }

        // 初始化
        renderGoods();
        renderCoupons();
    </script>
</body>
</html>
